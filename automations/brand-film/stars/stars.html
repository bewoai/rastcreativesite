<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Rast Creative — Takımyıldız</title>
<link rel="icon" href="data:," />
<!--
  Rast Creative Studio — "Takımyıldız" (1080×1920, 60 fps, 26 s).
  Every brand is a star: Sakarya first (six brands), then Turkey (Tekirdağ, Adıyaman);
  finally every star in the sky gathers into the Rast logo.
  Engine: stars.js · sound: stars-audio.js · maps: data/geo.json · brands: brands.json
  Every frame is a pure function of t (window.__render), like the other films.
-->
<style>
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 100 900; src: url("/public/fonts/fraunces-latin-wght-italic.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 100 900; src: url("/public/fonts/fraunces-latin-ext-wght-italic.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("/public/fonts/inter-latin-wght-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("/public/fonts/inter-latin-ext-wght-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0, U+2C60-2C7F, U+A720-A7FF; }
  :root { --ember: #ff8a3d; --ink: #f4eee5; --dim: rgba(244, 238, 229, .5); --mono: "DejaVu Sans Mono", "Liberation Mono", monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; animation: none !important; transition: none !important; }
  html, body { background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #040304; transform-origin: 0 0; isolation: isolate; font-family: "Inter", sans-serif; color: var(--ink); }
  #glow { position: absolute; inset: 0; }
  #maps { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  #maps .nb { fill: none; stroke: rgba(244, 238, 229, .13); stroke-width: 1.2; }
  #maps .ds { fill: none; stroke: rgba(244, 238, 229, .16); stroke-width: 1; stroke-dasharray: 3 5; }
  #maps .ol { fill: rgba(255, 138, 61, .035); stroke: rgba(255, 214, 180, .9); stroke-width: 2.4; filter: drop-shadow(0 0 6px rgba(255, 138, 61, .55)); }
  #maps .lk { fill: #020102; stroke: rgba(255, 190, 140, .45); stroke-width: 1.4; }
  #maps .pv { fill: none; stroke: rgba(244, 238, 229, .22); stroke-width: .9; }
  #maps .pv.home { fill: rgba(255, 138, 61, .35); stroke: rgba(255, 180, 120, .9); stroke-width: 1.6; }
  #sky { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .line { position: absolute; left: 0; right: 0; overflow: hidden; text-align: center; font: 900 100px/1.08 "Inter"; letter-spacing: -.035em; }
  .line span { display: inline-block; }
  .line em { font-style: normal; color: var(--ember); text-shadow: 0 0 30px rgba(255, 138, 61, .8); }
  .line.out span { color: transparent; -webkit-text-stroke: 2.5px rgba(244, 238, 229, .85); }

  /* footage window: a lens that opens above the map, tied to its star by a thin line */
  #win { position: absolute; left: 400px; top: 380px; width: 280px; height: 280px; border-radius: 50%; overflow: hidden; }
  #win img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #winRing { position: absolute; left: 392px; top: 372px; width: 296px; height: 296px; border-radius: 50%; border: 2px solid rgba(255, 170, 100, .85); box-shadow: 0 0 40px rgba(255, 138, 61, .45), inset 0 0 20px rgba(255, 138, 61, .3); }
  #wName { position: absolute; left: 0; right: 0; top: 292px; text-align: center; font: 800 36px/1 "Inter"; letter-spacing: .01em; white-space: nowrap; }
  #wPlace { position: absolute; left: 0; right: 0; top: 338px; text-align: center; font: 600 20px/1 var(--mono); letter-spacing: .3em; color: var(--ember); }

  #cnt { position: absolute; left: 60px; right: 60px; top: 1250px; display: flex; justify-content: space-around; }
  #cnt div { text-align: center; }
  #cnt b { display: block; font: 900 96px/1 "Inter"; letter-spacing: -.03em; }
  #cnt span { display: block; margin-top: 14px; font: 600 22px/1 var(--mono); letter-spacing: .3em; color: var(--dim); }
  #cnt div:nth-child(3) b { color: var(--ember); text-shadow: 0 0 30px rgba(255, 138, 61, .6); }

  #logo { position: absolute; left: 160px; top: 729.7px; width: 760px; height: 460.6px; }
  #logo svg { width: 100%; height: 100%; overflow: visible; }
  #logo .lt { fill: var(--ink); }
  #sun { position: absolute; left: 0; top: 0; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; z-index: 3;
    background: radial-gradient(circle at 40% 35%, #fff1dc, #ffc27d 25%, #ff9447 55%, #e07a2e 80%, #b9531a); }
  #halo { position: absolute; left: 0; top: 0; width: 700px; height: 700px; margin: -350px 0 0 -350px; border-radius: 50%; mix-blend-mode: screen; z-index: 2;
    background: radial-gradient(circle, rgba(255, 170, 100, .55) 0, rgba(255, 120, 50, .22) 18%, rgba(255, 90, 30, .07) 42%, transparent 70%); }
  #endL { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font: italic 440 92px/1.08 "Fraunces"; letter-spacing: -.02em; }
  #endL em { color: #ffb46b; text-shadow: 0 0 50px rgba(255, 150, 70, .45); }
  #endP { position: absolute; left: 50%; top: 1262px; height: 96px; padding: 0 48px; border-radius: 48px; display: flex; align-items: center; white-space: nowrap;
    border: 2px solid rgba(255, 150, 80, .7); background: rgba(255, 138, 61, .08); box-shadow: 0 0 40px rgba(255, 138, 61, .25), inset 0 0 24px rgba(255, 138, 61, .12); font: 800 42px/1 "Inter"; }
  #endP b { color: var(--ember); font-weight: 800; }
  #endS { position: absolute; left: 0; right: 0; top: 1394px; text-align: center; font: 600 24px/1.7 var(--mono); letter-spacing: .18em; color: var(--dim); }
  #endS b { color: var(--ink); font-weight: 600; }

  #bloom { position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen; background: radial-gradient(60% 40% at 50% 52%, rgba(255, 190, 130, .95), rgba(255, 110, 40, .4) 50%, transparent 80%); }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(100% 70% at 50% 50%, transparent 50%, rgba(0, 0, 0, .7) 100%); }
  #grain { position: absolute; inset: -60px; pointer-events: none; mix-blend-mode: overlay; opacity: .1; }
  #black { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 1; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 12px; align-items: center; padding: 10px 16px; background: #111; color: #ddd; font: 13px/1 system-ui; z-index: 20; }
  #ui input { flex: 1; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <svg id="maps" viewBox="0 0 1080 1920"><g id="gS"></g><g id="gT"></g></svg>
  <canvas id="sky" width="1080" height="1920"></canvas>

  <div class="line" id="i1" style="top:330px"><span>HER MARKANIN</span></div>
  <div class="line" id="i2" style="top:438px"><span>BİR IŞIĞI VAR<em>.</em></span></div>
  <div class="line" id="k1" style="top:330px"><span>SAKARYA<em>.</em></span></div>
  <div class="line" id="t1" style="top:330px"><span>SAKARYA'DAN</span></div>
  <div class="line out" id="t2" style="top:438px"><span>TÜRKİYE'YE<em>.</em></span></div>
  <div class="line" id="c1" style="top:330px"><span>HER MARKA</span></div>
  <div class="line" id="c2" style="top:438px"><span>BİR YILDIZ<em>.</em></span></div>

  <div id="win"><img alt="" /></div>
  <div id="winRing"></div>
  <p id="wName"></p>
  <p id="wPlace"></p>

  <div id="cnt">
    <div><b id="n1">0</b><span>MARKA</span></div>
    <div><b id="n2">0</b><span>ŞEHİR</span></div>
    <div><b id="n3">0</b><span>GÖKYÜZÜ</span></div>
  </div>

  <div id="logo"></div>
  <p id="endL">Sıradaki yıldız<br><em>sizin markanız.</em></p>
  <div id="endP"><span><b>rast</b>creative.com</span></div>
  <p id="endS">ÜCRETSİZ ÖN GÖRÜŞME · <b>0543 838 2404</b></p>

  <div id="halo"></div>
  <div id="sun"></div>
  <div id="bloom"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="black"></div>
</div>
<div id="ui"><button id="play">▶︎</button><input id="scrub" type="range" min="0" max="26" step="0.001" value="0" /><span id="tcu">0.00</span></div>
<script src="stars-audio.js"></script>
<script src="stars.js"></script>
</body>
</html>
