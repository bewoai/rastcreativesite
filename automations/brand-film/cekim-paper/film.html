<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Rast Creative — Çekim Günü (kâğıt)</title>

<!--
  Rast Creative Studio — "Çekim Günü" (1080×1920, 30 fps, 30 s).
  A 3D-animated shoot day: studio → highway with a drone → a clinic → the edit →
  a doctor who can't close his mouth. "Ağızları açık kalsın."
  Clips: Kling (prepare-cekim.mjs) · engine: cekim.js · sound: cekim-audio.js · clock: timing.js
-->
<style>
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 100 900; src: url("/public/fonts/fraunces-latin-wght-italic.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 100 900; src: url("/public/fonts/fraunces-latin-ext-wght-italic.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("/public/fonts/inter-latin-wght-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("/public/fonts/inter-latin-ext-wght-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0, U+2C60-2C7F, U+A720-A7FF; }
  :root { --ember: #ff8a3d; --ink: #f4eee5; }
  * { box-sizing: border-box; margin: 0; padding: 0; animation: none !important; transition: none !important; }
  html, body { background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; transform-origin: 0 0; isolation: isolate; font-family: "Inter", sans-serif; color: #fff; }
  #shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #word { position: absolute; left: 60px; right: 60px; top: 1270px; height: 160px; display: flex; align-items: center; justify-content: center; text-align: center; }
  #word > div { width: 100%; font: 800 76px/1.1 "Inter"; letter-spacing: -.02em; color: #fff;
    text-shadow: 0 4px 24px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .6); }
  #word.quote > div { font: italic 500 68px/1.12 "Fraunces"; letter-spacing: -.01em; }
  #word .w { display: inline-block; margin: 0 .12em; }

  /* end card */
  #end { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 50%, #17130f 0%, #070606 70%, #000 100%); opacity: 0; }
  #logo { position: absolute; left: 190px; top: 748px; width: 700px; height: 424.2px; opacity: 0; }
  #logo svg { width: 100%; height: 100%; overflow: visible; }
  #logo .lt { fill: var(--ink); }
  #endL { position: absolute; left: 0; right: 0; top: 1236px; text-align: center; font: italic 440 64px/1.15 "Fraunces"; color: #fff; opacity: 0; }
  #endP { position: absolute; left: 50%; top: 1352px; height: 84px; padding: 0 42px; border-radius: 42px; display: flex; align-items: center; white-space: nowrap; opacity: 0;
    border: 2px solid rgba(255, 150, 80, .7); background: rgba(255, 138, 61, .08); box-shadow: 0 0 40px rgba(255, 138, 61, .25); font: 800 38px/1 "Inter"; }
  #endP b { color: var(--ember); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #grain { position: absolute; inset: -60px; pointer-events: none; mix-blend-mode: overlay; opacity: .07; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(95% 70% at 50% 48%, transparent 55%, rgba(0, 0, 0, .45) 100%); }
  #black { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 0; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 12px; align-items: center; padding: 10px 16px; background: #111; color: #ddd; font: 13px/1 system-ui; z-index: 20; }
  #ui input { flex: 1; }
</style>
</head>

<div id="stage">
  <img id="shot" alt="Çekim Günü animasyon karesi" width="1080" height="1920" />
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="word"></div>
  <div id="end"></div>
  <div id="logo"></div>
  <p id="endL">Ağızları açık kalsın.</p>
  <div id="endP"><span><b>rast</b>creative.com</span></div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="600" height="1067"></canvas>
  <div id="black"></div>
</div>
<div id="ui"><button id="play">▶︎</button><input id="scrub" type="range" min="0" max="30" step="0.001" value="0" /><span id="tcu">0.00</span></div>
<script src="timing.js"></script>
<script src="../cekim-3d/cekim3d-audio.js"></script>
<script src="film.js"></script>
</body>
</html>
